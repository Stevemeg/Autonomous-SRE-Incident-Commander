name: trusted-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-release
  cancel-in-progress: false

env:
  ASIC_TEST_DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/asic
  ASIC_MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/asic
  ASIC_DATABASE_URL: postgresql+psycopg2://asic_app@localhost:5432/asic
  ASIC_PIP_AUDIT: /tmp/security-tools/bin/pip-audit

# Trust split: every step that executes repository-controlled code (tests, evaluation, Docker
# builds, scanning, kind smoke) runs in build-validate with a read-only token. publish-attest
# runs no repository code: it verifies, loads, pushes and attests the exact archives
# build-validate produced. Images are built exactly once.
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      skip_image_checks: true

  build-validate:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      backend_image_id: ${{ steps.archive.outputs.backend_image_id }}
      frontend_image_id: ${{ steps.archive.outputs.frontend_image_id }}
      backend_archive_sha256: ${{ steps.archive.outputs.backend_archive_sha256 }}
      frontend_archive_sha256: ${{ steps.archive.outputs.frontend_archive_sha256 }}
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: asic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d asic"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only release main or v* tags whose commit is reachable from protected main
        run: |
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/tags/v[0-9] ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked release tooling
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock
          python -m pip install --require-hashes --no-deps -r requirements/build-tools.lock
          python -m venv /tmp/security-tools
          /tmp/security-tools/bin/pip install --require-hashes --no-deps -r requirements/security-tools.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Migrate and run the complete 18-scenario evaluation gate
        run: |
          python -m alembic upgrade head
          python -c "import os,sqlalchemy as s; e=s.create_engine(os.environ['ASIC_MIGRATION_DATABASE_URL']); c=e.connect(); c.execute(s.text('ALTER ROLE asic_app LOGIN')); c.commit()"
          python -m asic.evaluation.gate --suite golden --mode simulator --tenant-slug phase14-release --baseline none --output /tmp/evaluation-simulator.json
          python -m asic.evaluation.gate --suite golden --mode replay --tenant-slug phase14-release --baseline latest --output /tmp/evaluation-replay.json
      - name: Build immutable release candidates once
        run: |
          docker build --pull=false --build-arg VCS_REF="$GITHUB_SHA" -t asic-backend:phase14-${GITHUB_SHA} .
          docker build --pull=false --build-arg VCS_REF="$GITHUB_SHA" -t asic-frontend:phase14-${GITHUB_SHA} frontend
      - name: Complete security gate with required container scanning
        run: >-
          python scripts/security_gate.py --strict --require-container-scan
          --container-image asic-backend:phase14-${GITHUB_SHA}
          --container-image asic-frontend:phase14-${GITHUB_SHA}
          --json /tmp/security-verdict.json
      - name: Generate and validate CycloneDX SBOMs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/out aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --output /out/backend.cdx.json asic-backend:phase14-${GITHUB_SHA}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/out aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --output /out/frontend.cdx.json asic-frontend:phase14-${GITHUB_SHA}
          python scripts/validate_sbom.py /tmp/backend.cdx.json --expect fastapi --expect SQLAlchemy --image-id "$(docker image inspect --format '{{.Id}}' asic-backend:phase14-${GITHUB_SHA})"
          python scripts/validate_sbom.py /tmp/frontend.cdx.json --expect next --expect react --image-id "$(docker image inspect --format '{{.Id}}' asic-frontend:phase14-${GITHUB_SHA})"
      - name: Install pinned kind and deploy the exact scanned artifacts
        run: |
          curl --fail --location --silent --show-error -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  /tmp/kind" | sha256sum --check
          sudo install /tmp/kind /usr/local/bin/kind
          python scripts/deployment_smoke.py --backend asic-backend:phase14-${GITHUB_SHA} --frontend asic-frontend:phase14-${GITHUB_SHA}
      - name: Archive the exact scanned images and record their identities
        id: archive
        run: |
          mkdir -p "$RUNNER_TEMP/release-images"
          for component in backend frontend; do
            image="asic-${component}:phase14-${GITHUB_SHA}"
            docker save --output "$RUNNER_TEMP/release-images/${component}.tar" "$image"
            echo "${component}_image_id=$(docker image inspect --format '{{.Id}}' "$image")" >>"$GITHUB_OUTPUT"
            echo "${component}_archive_sha256=$(sha256sum "$RUNNER_TEMP/release-images/${component}.tar" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase14-release-images-${{ github.sha }}
          path: ${{ runner.temp }}/release-images/*.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase14-release-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            /tmp/backend.cdx.json
            /tmp/frontend.cdx.json
            /tmp/security-verdict.json
            /tmp/evaluation-simulator.json
            /tmp/evaluation-replay.json

  publish-attest:
    needs: build-validate
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      # No checkout: this job executes no repository-controlled code.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase14-release-images-${{ github.sha }}
          path: ${{ runner.temp }}/release-images
      - name: Verify archive checksums and load the exact validated images
        env:
          BACKEND_ARCHIVE_SHA256: ${{ needs.build-validate.outputs.backend_archive_sha256 }}
          FRONTEND_ARCHIVE_SHA256: ${{ needs.build-validate.outputs.frontend_archive_sha256 }}
          BACKEND_IMAGE_ID: ${{ needs.build-validate.outputs.backend_image_id }}
          FRONTEND_IMAGE_ID: ${{ needs.build-validate.outputs.frontend_image_id }}
        run: |
          cd "$RUNNER_TEMP/release-images"
          printf '%s  backend.tar\n%s  frontend.tar\n' "$BACKEND_ARCHIVE_SHA256" "$FRONTEND_ARCHIVE_SHA256" | sha256sum --check --strict
          docker load --input backend.tar
          docker load --input frontend.tar
          test "$(docker image inspect --format '{{.Id}}' "asic-backend:phase14-${GITHUB_SHA}")" = "$BACKEND_IMAGE_ID"
          test "$(docker image inspect --format '{{.Id}}' "asic-frontend:phase14-${GITHUB_SHA}")" = "$FRONTEND_IMAGE_ID"
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact scanned images and bind registry digests to the scanned image IDs
        id: push
        env:
          BACKEND_IMAGE_ID: ${{ needs.build-validate.outputs.backend_image_id }}
          FRONTEND_IMAGE_ID: ${{ needs.build-validate.outputs.frontend_image_id }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for component in backend frontend; do
            name="ghcr.io/${owner}/asic-${component}"
            docker tag "asic-${component}:phase14-${GITHUB_SHA}" "${name}:${GITHUB_SHA}"
            docker push "${name}:${GITHUB_SHA}"
            digest=$(docker image inspect "${name}:${GITHUB_SHA}" | jq -er --arg repo "${name}@" '.[0].RepoDigests[] | select(startswith($repo)) | split("@")[1]')
            config=$(docker buildx imagetools inspect --raw "${name}@${digest}" | jq -er '.config.digest')
            expected_var="${component^^}_IMAGE_ID"
            test "$config" = "${!expected_var}"
            echo "${component}_name=${name}" >>"$GITHUB_OUTPUT"
            echo "${component}_digest=${digest}" >>"$GITHUB_OUTPUT"
          done
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.push.outputs.backend_name }}
          subject-digest: ${{ steps.push.outputs.backend_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.push.outputs.frontend_name }}
          subject-digest: ${{ steps.push.outputs.frontend_digest }}
          push-to-registry: true
      - name: Verify attestations against the immutable published identities
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ steps.push.outputs.backend_name }}@${{ steps.push.outputs.backend_digest }}
          FRONTEND: ${{ steps.push.outputs.frontend_name }}@${{ steps.push.outputs.frontend_digest }}
        run: |
          for image in "$BACKEND" "$FRONTEND"; do
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
          echo "Deploy with release_commit=$GITHUB_SHA backend_image=$BACKEND frontend_image=$FRONTEND"
