name: trusted-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-release
  cancel-in-progress: false

env:
  ASIC_TEST_DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/asic
  ASIC_MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/asic
  ASIC_DATABASE_URL: postgresql+psycopg2://asic_app@localhost:5432/asic
  ASIC_PIP_AUDIT: /tmp/security-tools/bin/pip-audit

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      skip_image_checks: true
  release:
    needs: quality
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: asic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d asic"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Only release commits reachable from protected main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked release tooling
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock
          python -m pip install --require-hashes --no-deps -r requirements/build-tools.lock
          python -m venv /tmp/security-tools
          /tmp/security-tools/bin/pip install --require-hashes --no-deps -r requirements/security-tools.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Migrate and run the complete 18-scenario evaluation gate
        run: |
          python -m alembic upgrade head
          python -c "import os,sqlalchemy as s; e=s.create_engine(os.environ['ASIC_MIGRATION_DATABASE_URL']); c=e.connect(); c.execute(s.text('ALTER ROLE asic_app LOGIN')); c.commit()"
          python -m asic.evaluation.gate --suite golden --mode simulator --tenant-slug phase14-release --baseline none --output /tmp/evaluation-simulator.json
          python -m asic.evaluation.gate --suite golden --mode replay --tenant-slug phase14-release --baseline latest --output /tmp/evaluation-replay.json
      - name: Build immutable release candidates once
        run: |
          docker build --pull=false --build-arg VCS_REF="$GITHUB_SHA" -t asic-backend:phase14-${GITHUB_SHA} .
          docker build --pull=false --build-arg VCS_REF="$GITHUB_SHA" -t asic-frontend:phase14-${GITHUB_SHA} frontend
      - name: Complete security gate with required container scanning
        run: >-
          python scripts/security_gate.py --strict --require-container-scan
          --container-image asic-backend:phase14-${GITHUB_SHA}
          --container-image asic-frontend:phase14-${GITHUB_SHA}
          --json /tmp/security-verdict.json
      - name: Generate and validate CycloneDX SBOMs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/out aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --output /out/backend.cdx.json asic-backend:phase14-${GITHUB_SHA}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/out aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --output /out/frontend.cdx.json asic-frontend:phase14-${GITHUB_SHA}
          python scripts/validate_sbom.py /tmp/backend.cdx.json --expect fastapi --expect SQLAlchemy --image-id "$(docker image inspect --format '{{.Id}}' asic-backend:phase14-${GITHUB_SHA})"
          python scripts/validate_sbom.py /tmp/frontend.cdx.json --expect next --expect react --image-id "$(docker image inspect --format '{{.Id}}' asic-frontend:phase14-${GITHUB_SHA})"
      - name: Install pinned kind and deploy the exact scanned artifacts
        run: |
          curl --fail --location --silent --show-error -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  /tmp/kind" | sha256sum --check
          sudo install /tmp/kind /usr/local/bin/kind
          python scripts/deployment_smoke.py --backend asic-backend:phase14-${GITHUB_SHA} --frontend asic-frontend:phase14-${GITHUB_SHA}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase14-release-evidence-${{ github.sha }}
          path: |
            /tmp/backend.cdx.json
            /tmp/frontend.cdx.json
            /tmp/security-verdict.json
            /tmp/evaluation-simulator.json
            /tmp/evaluation-replay.json
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact scanned images
        id: push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          backend="ghcr.io/${owner}/asic-backend:${GITHUB_SHA}"
          frontend="ghcr.io/${owner}/asic-frontend:${GITHUB_SHA}"
          docker tag asic-backend:phase14-${GITHUB_SHA} "$backend"
          docker tag asic-frontend:phase14-${GITHUB_SHA} "$frontend"
          docker push "$backend"
          docker push "$frontend"
          echo "backend_name=ghcr.io/${owner}/asic-backend" >>"$GITHUB_OUTPUT"
          echo "frontend_name=ghcr.io/${owner}/asic-frontend" >>"$GITHUB_OUTPUT"
          backend_digest=$(docker image inspect "$backend" | jq -er --arg repo "ghcr.io/${owner}/asic-backend@" '.[0].RepoDigests[] | select(startswith($repo)) | split("@")[1]')
          frontend_digest=$(docker image inspect "$frontend" | jq -er --arg repo "ghcr.io/${owner}/asic-frontend@" '.[0].RepoDigests[] | select(startswith($repo)) | split("@")[1]')
          echo "backend_digest=$backend_digest" >>"$GITHUB_OUTPUT"
          echo "frontend_digest=$frontend_digest" >>"$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.push.outputs.backend_name }}
          subject-digest: ${{ steps.push.outputs.backend_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.push.outputs.frontend_name }}
          subject-digest: ${{ steps.push.outputs.frontend_digest }}
          push-to-registry: true

      - name: Verify attestations against the immutable published identities
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND: ${{ steps.push.outputs.backend_name }}@${{ steps.push.outputs.backend_digest }}
          FRONTEND: ${{ steps.push.outputs.frontend_name }}@${{ steps.push.outputs.frontend_digest }}
        run: |
          gh attestation verify "oci://$BACKEND" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "oci://$FRONTEND" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
