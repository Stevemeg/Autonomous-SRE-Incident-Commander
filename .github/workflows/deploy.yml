name: production-deploy

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: Immutable backend image (name@sha256:digest)
        required: true
        type: string
      frontend_image:
        description: Immutable frontend image (name@sha256:digest)
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      GH_TOKEN: ${{ github.token }}
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      FRONTEND_IMAGE: ${{ inputs.frontend_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify release attestations before accessing the cluster
        run: |
          gh attestation verify "oci://$BACKEND_IMAGE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "oci://$FRONTEND_IMAGE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
      - name: Validate and render the protected platform configuration
        env:
          DEPLOYMENT_CONFIG: ${{ vars.DEPLOYMENT_CONFIG_JSON }}
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock
          printf '%s' "$DEPLOYMENT_CONFIG" >"$RUNNER_TEMP/platform.json"
          python scripts/render_deployment.py --config "$RUNNER_TEMP/platform.json" --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE" --output "$RUNNER_TEMP/rendered"
      - name: Validate immutable inputs and protected cluster identity
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          [[ "$BACKEND_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          test -n "$KUBE_CONFIG_DATA"
          umask 077
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode >"$RUNNER_TEMP/kubeconfig"
      - name: Run migration before rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/rendered/base.yaml"
          kubectl delete job asic-migration -n asic-system --ignore-not-found
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/rendered/migration.yaml"
          kubectl apply -f "$RUNNER_TEMP/rendered/migration.yaml"
          kubectl wait --for=condition=complete job/asic-migration -n asic-system --timeout=10m
      - name: Roll out exact attested image identities
        id: rollout
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          kubectl apply -f "$RUNNER_TEMP/rendered/base.yaml"
          kubectl rollout status deployment/asic-api -n asic-system --timeout=10m
          kubectl rollout status deployment/asic-frontend -n asic-system --timeout=10m
      - name: Stop on failed rollout; require an explicit compatible application rollback
        if: failure() && steps.rollout.outcome == 'failure'
        run: |
          echo 'Deployment failed. Use the documented previous-digest rollback after checking schema compatibility. Database downgrade is never automatic.'
          exit 1
      - name: Remove ephemeral cluster credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
