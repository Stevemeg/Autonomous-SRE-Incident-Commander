name: quality

on:
  workflow_call:
    inputs:
      skip_image_checks:
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24.11.1"
  ASIC_TEST_DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/asic
  ASIC_MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/asic

jobs:
  backend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: asic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d asic"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock
          python -m pip install --require-hashes --no-deps -r requirements/build-tools.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Migrate an empty database
        run: python -m alembic upgrade head
      - name: Repository and Python gates
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy --strict src
          python scripts/validate_docs.py
          python scripts/verify_spec_transcription.py
          python scripts/check_repo_hygiene.py
          python scripts/check_runtime_dependencies.py
          python scripts/check_dependency_lock.py
          python -m alembic check
          python -m pytest -q
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.29"
          enable-cache: false
      - name: Independent clean installation from package metadata
        run: python scripts/verify_clean_install.py
      - name: Complete evaluation corpus through the application role
        env:
          ASIC_DATABASE_URL: postgresql+psycopg2://asic_app@localhost:5432/asic
        run: |
          python -c "import os,sqlalchemy as s; e=s.create_engine(os.environ['ASIC_MIGRATION_DATABASE_URL']); c=e.connect(); c.execute(s.text('ALTER ROLE asic_app LOGIN')); c.commit()"
          python -m asic.evaluation.gate --suite golden --mode simulator --baseline none --output /tmp/simulator.json
          python -m asic.evaluation.gate --suite golden --mode replay --baseline latest --output /tmp/replay.json
      - name: Supply-chain tools in an isolated environment
        run: |
          python -m venv /tmp/security-tools
          /tmp/security-tools/bin/pip install --require-hashes --no-deps -r requirements/security-tools.lock
      - name: Repository security gate
        env:
          ASIC_PIP_AUDIT: /tmp/security-tools/bin/pip-audit
        run: python scripts/security_gate.py --strict --skip container_scan

  frontend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Frontend liveness/readiness contract against the production build
        run: npm run test:health
      - run: npm audit --omit=dev --audit-level=high

  image-security:
    if: ${{ !inputs.skip_image_checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend-quality, frontend-quality, infrastructure]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the production images once
        run: |
          docker build --pull=false --build-arg VCS_REF="$GITHUB_SHA" -t asic-backend:phase14-ci .
          docker build --pull=false --build-arg VCS_REF="$GITHUB_SHA" -t asic-frontend:phase14-ci frontend
      - name: Install security gate dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock
          python -m pip install --require-hashes --no-deps -r requirements/build-tools.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Mandatory scan of the built images
        run: >-
          python scripts/security_gate.py --strict --only container_scan
          --require-container-scan --container-image asic-backend:phase14-ci
          --container-image asic-frontend:phase14-ci
      - name: Generate and validate final-image SBOMs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/out aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --output /out/backend.json asic-backend:phase14-ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/out aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 image --format cyclonedx --output /out/frontend.json asic-frontend:phase14-ci
          python scripts/validate_sbom.py /tmp/backend.json --expect fastapi --expect SQLAlchemy --image-id "$(docker image inspect --format '{{.Id}}' asic-backend:phase14-ci)"
          python scripts/validate_sbom.py /tmp/frontend.json --expect next --expect react --image-id "$(docker image inspect --format '{{.Id}}' asic-frontend:phase14-ci)"
      - name: Install pinned kind
        run: |
          curl --fail --location --silent --show-error -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  /tmp/kind" | sha256sum --check
          sudo install /tmp/kind /usr/local/bin/kind
      - name: Deploy the exact scanned artifacts
        run: python scripts/deployment_smoke.py --backend asic-backend:phase14-ci --frontend asic-frontend:phase14-ci

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Render Kubernetes resources
        run: |
          kubectl kustomize deploy/kubernetes/base >/tmp/base.yaml
          kubectl kustomize deploy/kubernetes/migration >/tmp/migration.yaml
          kubectl kustomize deploy/kubernetes/overlays/local >/tmp/local.yaml
          kubectl kustomize deploy/kubernetes/overlays/local-migration >/tmp/local-migration.yaml
      - name: Observability configuration and alert behavior
        run: bash scripts/check_observability.sh
      - name: Validate workflow syntax and expressions
        run: |
          curl --fail --location --silent --show-error -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck= -pyflakes=
      - name: Terraform format and validate
        run: |
          docker run --rm -v "$PWD:/work" -w /work/infra/terraform/platform hashicorp/terraform@sha256:dfb1889a8ee74ada3ddacc48f89b8a0d69f3e114de3d8a2ce15f6a8d3dbfdbe2 fmt -check -recursive
          docker run --rm -v "$PWD:/work" -w /work/infra/terraform/platform hashicorp/terraform@sha256:dfb1889a8ee74ada3ddacc48f89b8a0d69f3e114de3d8a2ce15f6a8d3dbfdbe2 init -backend=false -lockfile=readonly
          docker run --rm -v "$PWD:/work" -w /work/infra/terraform/platform hashicorp/terraform@sha256:dfb1889a8ee74ada3ddacc48f89b8a0d69f3e114de3d8a2ce15f6a8d3dbfdbe2 validate
