apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asic-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asic-frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asic-frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 3000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asic-frontend
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asic-api
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-platform-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asic-api
  policyTypes: [Egress]
  egress:
    # TEST-NET-1 fails closed. Production overlays replace it with the managed
    # PostgreSQL endpoint CIDR; DNS names cannot be expressed by NetworkPolicy.
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 4318}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asic-egress-gateway
      ports:
        - {protocol: TCP, port: 8443}
---
# The worker serves nothing but its probes (kubelet) and, optionally, /metrics to the
# observability namespace. No frontend, ingress controller or other namespace reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asic-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 8081}
---
# Narrower than the API's: the worker needs the database, the trace collector and the egress
# gateway (the only route to integration adapters). It never talks to the identity provider, so
# the renderer's reviewed direct-HTTPS CIDRs are not appended to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-platform-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asic-worker
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 4318}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asic-egress-gateway
      ports:
        - {protocol: TCP, port: 8443}
