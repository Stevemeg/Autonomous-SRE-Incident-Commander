apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migration-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: asic-migration
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Production overlays replace this TEST-NET address with the managed DB CIDR.
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - {protocol: TCP, port: 5432}
