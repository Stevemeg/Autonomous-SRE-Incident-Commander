apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: asic-system
# Local kind only: the retention CronJob against the in-cluster test database. The login below
# holds only asic_maintenance; the smoke creates it (trust auth, test database only).
resources:
  - ../../maintenance
  - local-network-policy.yaml
secretGenerator:
  - name: asic-maintenance-database
    literals:
      - url=postgresql+psycopg2://asic_maintenance_local@postgres:5432/asic
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: ghcr.io/stevemeg/asic-backend
    newName: asic-backend
    newTag: phase14-local
patches:
  # Explicit local-test profile (see local-migration): plaintext only because not production.
  - target:
      kind: CronJob
      name: asic-retention
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/1
        value:
          name: ASIC_DEPLOYMENT_ENVIRONMENT
          value: local
  - target:
      kind: NetworkPolicy
      name: retention-egress
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: postgres
          ports:
            - protocol: TCP
              port: 5432
