apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: asic-system
resources:
  - postgres.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - 001-role.sql
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/part-of: asic
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
