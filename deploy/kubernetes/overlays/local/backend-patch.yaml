apiVersion: apps/v1
kind: Deployment
metadata:
  name: asic-api
spec:
  replicas: 1
  minReadySeconds: 0
  template:
    spec:
      containers:
        - name: api
          env:
            - name: ASIC_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: asic-local-auth
                  key: jwt-secret
