apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-migration-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: asic-migration
      ports:
        - {protocol: TCP, port: 5432}
