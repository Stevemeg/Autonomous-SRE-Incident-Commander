[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asic"
version = "0.10.0"
description = "Autonomous SRE Incident Commander - governed incident investigation and remediation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

# Runtime dependencies through Phase 9. LangGraph is ADR-0002, OpenTelemetry is ADR-0010,
# FastAPI is ADR-0024, and the deterministic internal model port remains ADR-0016.
# Deliberately absent: live model-provider SDKs and infrastructure clients; those arrive
# only with a phase that implements and validates their security boundary.
dependencies = [
    "SQLAlchemy>=2.0.23,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5,<3.0",
    "langgraph>=1.0,<2.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    # Phase 6: src/asic/db/models/knowledge.py imports pgvector.sqlalchemy.Vector at
    # module load time, so this is a hard runtime dependency, not a dev-only extra.
    "pgvector>=0.3.6,<0.6",
    "fastapi>=0.116,<1.0",
    "PyJWT>=2.10,<3.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asic = ["py.typed"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "N818",   # exception naming: our domain errors read better without the suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/asic/db/models/*" = ["A003"]  # `id`, `type` are legitimate column names

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = []
mypy_path = "src"
packages = ["asic"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# -------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: test requires a live PostgreSQL instance (set ASIC_TEST_DATABASE_URL)",
]
