[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped, ordered revision filenames. Alphabetical order equals chronological order,
# which makes a migration directory reviewable at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# The connection string is supplied by the environment (ASIC_DATABASE_URL) in env.py.
# Deliberately empty here so a credential can never be committed to the repository.
sqlalchemy.url =

# No post-write hooks: resolving a console-script entrypoint depends on how alembic was
# invoked, and a hook that fails leaves a half-processed revision behind. Generated
# revisions are formatted by the normal `ruff format` pass over the repository instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
